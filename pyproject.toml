[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multipass-transformer-training"
version = "0.2.0"
description = "Research code for multi-pass transformer training on symbolic state-tracking tasks."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "jupyter>=1",
    "matplotlib>=3.7",
    "nbformat>=5",
    "pytest>=7",
]

[tool.setuptools]
py-modules = ["model_factory", "models"]

[tool.setuptools.packages.find]
include = ["tasks*", "experiments*"]
exclude = ["tests*", "results*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:cacheprovider"]
